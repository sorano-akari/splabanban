<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>スプラバンバン</title>
    <style>
        body {
            margin: 0;
            background: #222;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            user-select: none;
            touch-action: none;
            overflow: hidden;
        }
        h1 {
            margin: 10px 0 0 0;
            font-size: 1.8rem;
            color: #fff;
            text-shadow: 0 0 10px #aaa;
        }
        /* 希望1 & 3: 背景を漆黒にし、枠にシアンとマゼンタのネオン光を付与。レールとマスの色を際立たせる */
        canvas {
            background: #000;
            margin-top: 10px;
            box-shadow: 0 4px 30px rgba(0, 255, 255, 0.2), 0 4px 30px rgba(255, 0, 85, 0.2);
            cursor: pointer;
            border: 1px solid #1a1a1a;
        }
        #ui {
            margin-top: 10px;
            display: flex;
            gap: 30px;
            font-size: 1.4rem;
            font-weight: bold;
            align-items: center;
        }
        .p1 {
            color: #00ffff;
            text-shadow: 0 0 5px #00ffff;
        }
        .p2 {
            color: #ff0055;
            text-shadow: 0 0 5px #ff0055;
        }
        #timer {
            font-size: 2rem;
            color: #fff;
            background: #444;
            padding: 5px 15px;
            border-radius: 8px;
            box-shadow: inset 0 0 5px #000;
        }
        #instructions {
            margin-top: 10px;
            font-size: 0.9rem;
            color: #ccc;
            text-align: center;
            line-height: 1.4;
            max-width: 600px;
            padding: 0 10px;
        }
        .highlight {
            color: #fff;
            font-weight: bold;
        }
        select {
            background: #444;
            color: #fff;
            border: none;
            border-radius: 4px;
            padding: 2px;
        }
    </style>
</head>
<body>
    <h1>スプラバンバン</h1>
    <div id="settings" style="margin-top: 5px; display: flex; gap: 10px; font-size: 0.85rem; color: #ccc; align-items: center; flex-wrap: wrap; justify-content: center; max-width: 500px;">
        <label>盤面: 
            <select id="gridSelect">
                <option value="5">5x5</option>
                <option value="7">7x7</option>
                <option value="9">9x9</option>
            </select>
        </label>
        <label>速度: 
            <select id="speedSelect">
                <option value="3.8">遅</option>
                <option value="2.5" selected>普</option>
                <option value="1.2">速</option>
                <option value="0.6">最速</option>
                <option value="0.1" style="color:#ffcc00; font-weight:bold;">⚡超絶早送り(検証用)</option>
            </select>
        </label>
        <label>時間: 
            <select id="timeSelect">
                <option value="60">60秒</option>
                <option value="90" selected>90秒</option>
                <option value="120">120秒</option>
            </select>
        </label>
        <!-- AI選択プルダウンを追加 -->
        <label style="color:#00ffff;">P1: 
            <select id="p1AiSelect">
                <option value="manual" selected>あなた(手動)</option>
                <option value="ramu">ラム(気まぐれ)</option>
                <option value="dero">デロ(開拓者)</option>
                <option value="sei">セイ(安全第一)</option>
                <option value="kou">コウ(策士)</option>
                <option value="saki" style="color:#ff00ff; font-weight:bold;">サキ(堅実)</option>
                <option value="chou" style="color:#ffcc00; font-weight:bold;">チョウ(頂点)</option>
            </select>
        </label>
        <label style="color:#ff0055;">P2: 
            <select id="p2AiSelect">
                <option value="ramu">ラム(気まぐれ)</option>
                <option value="dero">デロ(開拓者)</option>
                <option value="sei" selected>セイ(安全第一)</option>
                <option value="kou">コウ(策士)</option>
                <option value="saki" style="color:#ff00ff; font-weight:bold;">サキ(堅実)</option>
                <option value="chou" style="color:#ffcc00; font-weight:bold;">チョウ(頂点)</option>
            </select>
        </label>
        <button id="actionBtn" style="padding: 4px 10px; cursor:pointer; background:#ffaa00; color:#000; border:none; border-radius:4px; font-weight:bold;">🎲 シャッフル</button>
    </div>
    <div style="margin-top: 15px; display: flex; gap: 10px; align-items: center; justify-content: center;">
        <button id="startBtn" style="padding: 12px 40px; cursor:pointer; background: linear-gradient(45deg, #00ffff, #0088ff); color:#000; border:none; border-radius:30px; font-size: 1.5rem; font-weight:bold; box-shadow: 0 4px 15px rgba(0, 255, 255, 0.4); transition: 0.2s;">▶ スタート</button>
        <button id="demoBtn" style="padding: 8px 15px; cursor:pointer; background: #555; color:#fff; border:none; border-radius:20px; font-size: 0.9rem; font-weight:bold;">🤖 デモ観戦</button>
        <button id="autoBtn" style="padding: 8px 15px; cursor:pointer; background: #800080; color:#fff; border:none; border-radius:20px; font-size: 0.9rem; font-weight:bold;">🔄 連続対戦開始</button>
    </div>
    <div id="records" style="font-size: 0.8rem; color: #aaa; margin-top: 10px;">
        戦績: あなた <span id="winCount1">0</span>勝 / COM <span id="winCount2">0</span>勝 / 引分 <span id="drawCount">0</span>回
        <button id="recordResetBtn" style="margin-left: 10px; padding: 2px 5px; font-size: 0.7rem; background:#444; color:#fff; border:none; border-radius:4px; cursor:pointer;">リセット</button>
    </div>
    <div id="ui">
        <div class="p1">P1: <span id="score1">0</span>%</div>
        <div id="timer">90</div>
        <div class="p2">P2: <span id="score2">0</span>%</div>
    </div>
    <canvas id="gameCanvas" width="500" height="500"></canvas>
    <div id="instructions">
        <strong>[タップで占有]</strong>: マスを触ると1秒間<span style="color:#00ffff">青く発光</span>し、何度でも回せます。<br>
        <strong>[フリック]</strong>: 隣のマスと入れ替え。四角く囲むと一気塗り！
    </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let GRID = 5;
let TILE_SIZE = canvas.width / GRID;
let SPEED = 2.5; 
let GAME_TIME = 90; 

// 勝敗レコード
let winsP1 = 0, winsP2 = 0, draws = 0;

// UIイベントのフック（待機中のみ変更可能）
document.getElementById('gridSelect').addEventListener('change', (e) => { if(gameState === 'waiting') { GRID = parseInt(e.target.value); resetGame(); } });
document.getElementById('speedSelect').addEventListener('change', (e) => { if(gameState === 'waiting') SPEED = parseFloat(e.target.value); });
document.getElementById('timeSelect').addEventListener('change', (e) => { if(gameState === 'waiting') { GAME_TIME = parseInt(e.target.value); resetGame(); } });

let isDemo = false;
let isAutoBattle = false; // 連続対戦フラグ

function startGame() {
    gameState = 'playing';
    lastTime = performance.now();
    SPEED = parseFloat(document.getElementById('speedSelect').value);
    
    let startBtn = document.getElementById('startBtn');
    startBtn.innerText = '⏸ 一時停止';
    startBtn.style.background = 'linear-gradient(45deg, #ffaa00, #ff4400)';
    startBtn.style.boxShadow = '0 4px 15px rgba(255, 170, 0, 0.4)';
    
    let actionBtn = document.getElementById('actionBtn');
    actionBtn.innerText = '🏳️ リセット';
    actionBtn.style.background = '#ff0055';
    actionBtn.style.color = '#fff';

    document.getElementById('gridSelect').disabled = true;
    document.getElementById('speedSelect').disabled = true;
    document.getElementById('timeSelect').disabled = true;
    document.getElementById('p1AiSelect').disabled = true;
    document.getElementById('p2AiSelect').disabled = true;
    document.getElementById('demoBtn').style.display = 'none';
    if (!isAutoBattle) {
        document.getElementById('autoBtn').style.display = 'none';
    }
}

document.getElementById('startBtn').addEventListener('click', () => {
    if (gameState === 'finished') {
        resetGame(); 
    } else if (gameState === 'waiting') {
        isDemo = false; isAutoBattle = false;
        startGame();
    } else if (gameState === 'playing') {
        gameState = 'paused';
        document.getElementById('startBtn').innerText = '▶ 再開';
        document.getElementById('startBtn').style.background = 'linear-gradient(45deg, #00ff88, #008800)';
        document.getElementById('startBtn').style.boxShadow = '0 4px 15px rgba(0, 255, 136, 0.4)';
    } else if (gameState === 'paused') {
        gameState = 'playing';
        lastTime = performance.now(); 
        document.getElementById('startBtn').innerText = '⏸ 一時停止';
        document.getElementById('startBtn').style.background = 'linear-gradient(45deg, #ffaa00, #ff4400)';
        document.getElementById('startBtn').style.boxShadow = '0 4px 15px rgba(255, 170, 0, 0.4)';
    }
});

document.getElementById('actionBtn').addEventListener('click', () => {
    if (gameState === 'waiting') resetGame();
    else if (gameState === 'playing' || gameState === 'paused') resetGame();
});

document.getElementById('demoBtn').addEventListener('click', () => {
    if (gameState === 'waiting' || gameState === 'finished') {
        isDemo = true; isAutoBattle = false;
        startGame();
    }
});

document.getElementById('autoBtn').addEventListener('click', () => {
    if (gameState === 'waiting' || gameState === 'finished') {
        if (!isAutoBattle) {
            isDemo = true; isAutoBattle = true;
            document.getElementById('autoBtn').innerText = '⏹ 連続対戦停止';
            document.getElementById('autoBtn').style.background = '#444';
            startGame();
        } else {
            isAutoBattle = false;
            document.getElementById('autoBtn').innerText = '🔄 連続対戦開始';
            document.getElementById('autoBtn').style.background = '#800080';
        }
    } else if (gameState === 'playing' || gameState === 'paused') {
        if (isAutoBattle) {
            isAutoBattle = false;
            document.getElementById('autoBtn').innerText = '🔄 連続対戦開始';
            document.getElementById('autoBtn').style.background = '#800080';
            document.getElementById('autoBtn').style.display = 'none'; // プレイ中は隠す
        }
    }
});

document.getElementById('recordResetBtn').addEventListener('click', () => {
    winsP1 = 0; winsP2 = 0; draws = 0;
    updateRecords();
});

function updateRecords() {
    document.getElementById('winCount1').innerText = winsP1;
    document.getElementById('winCount2').innerText = winsP2;
    document.getElementById('drawCount').innerText = draws;
}

const TYPES = ['line', 'curve', 'cross', 'overpass', 'oneway', 'double_curve'];

function rotateTileLogic(tile, diff) {
    tile.rotation = (tile.rotation + diff + 4) % 4;
    [p1, p2].forEach(p => {
        if (p.tx === tile.x && p.ty === tile.y) {
            p.fromDir = (p.fromDir + diff + 4) % 4;
            p.toDir = (p.toDir + diff + 4) % 4;
        }
    });
}

class Tile {
    constructor(x, y) {
        this.x = x;
        this.y = y;
        this.visualX = x; 
        this.visualY = y;
        this.type = TYPES[Math.floor(Math.random() * TYPES.length)];
        this.rotation = Math.floor(Math.random() * 4);
        this.visualRotation = this.rotation; 
        this.owner = 0; 
        this.vfxTime = 0; // 必殺技のエフェクト用タイマー
        
        // 占有権システム
        this.lockedBy = 0; // 0:なし, 1:P1, 2:P2
        this.lockUntil = 0;
    }

    getExit(enterDir) {
        let localIn = (enterDir - this.rotation + 4) % 4;
        let localOut = null;
        if (this.type === 'line') {
            if (localIn === 0) localOut = 2;
            if (localIn === 2) localOut = 0;
        } else if (this.type === 'curve') {
            if (localIn === 0) localOut = 1;
            if (localIn === 1) localOut = 0; // タイポ（LocalOut、括弧不足）を修正
        } else if (this.type === 'cross' || this.type === 'overpass') {
            localOut = (localIn + 2) % 4;
        } else if (this.type === 'oneway') {
            if (localIn === 2) localOut = 0; 
        } else if (this.type === 'double_curve') {
            // 交わらない2つのカーブ（0⇔3, 1⇔2）
            if (localIn === 0) localOut = 3;
            if (localIn === 3) localOut = 0;
            if (localIn === 1) localOut = 2;
            if (localIn === 2) localOut = 1; // 比較対象（2）の抜け、括弧不足を修正
        }
        if (localOut === null) return null;
        return (localOut + this.rotation) % 4;
    }
}

class Player {
    constructor(id, color, tx, ty) {
        this.id = id;
        this.color = color;
        this.tx = tx;
        this.ty = ty;
        this.fromDir = 0;
        this.toDir = 2;
        this.progress = 0.5;
        this.cooldown = 0; // COM用の行動待機時間
    }

    reverse() {
        this.progress = 1.0 - this.progress;
        let temp = this.fromDir;
        this.fromDir = this.toDir;
        this.toDir = temp;
    }
}

let gameState = 'waiting'; 
let timeLeft = GAME_TIME;
let board = [];
let p1, p2;
let lastTime = performance.now();

function resetGame() {
    TILE_SIZE = canvas.width / GRID;
    board = [];
    
    // まず上半分を通常通りランダム生成
    for (let y = 0; y < GRID; y++) {
        board[y] = [];
        for (let x = 0; x < GRID; x++) {
            board[y][x] = new Tile(x, y);
        }
    }
    
    // 【フェアプレイ機能】点対称（180度回転）で下半分にコピー
    for (let y = 0; y < Math.ceil(GRID / 2); y++) {
        for (let x = 0; x < GRID; x++) {
            if (y === Math.floor(GRID / 2) && x >= Math.ceil(GRID / 2)) continue; // 中央行の右半分は処理済み
            let tx = GRID - 1 - x;
            let ty = GRID - 1 - y;
            board[ty][tx].type = board[y][x].type;
            board[ty][tx].rotation = (board[y][x].rotation + 2) % 4;
            board[ty][tx].visualRotation = board[ty][tx].rotation; // 【修正】見た目の角度も即座に同期する
        }
    }

    // スタート地点を必ず「十字」にし、最初から自陣の色にしておく
    board[0][0].type = 'cross'; board[0][0].rotation = 0; board[0][0].visualRotation = 0; board[0][0].owner = 1;
    board[GRID - 1][GRID - 1].type = 'cross'; board[GRID - 1][GRID - 1].rotation = 0; board[GRID - 1][GRID - 1].visualRotation = 0; board[GRID - 1][GRID - 1].owner = 2;

    p1 = new Player(1, '#00ffff', 0, 0);
    p1.fromDir = 0; p1.toDir = 2; p1.willBounce = false;
    p2 = new Player(2, '#ff0055', GRID - 1, GRID - 1);
    p2.fromDir = 2; p2.toDir = 0; p2.willBounce = false;
    
    timeLeft = GAME_TIME;
    document.getElementById('timer').innerText = GAME_TIME;
    gameState = 'waiting'; // スタートボタンを押すまで待機状態に
    
    // UIボタンのリセット
    let startBtn = document.getElementById('startBtn');
    startBtn.innerText = '▶ スタート';
    startBtn.style.background = 'linear-gradient(45deg, #00ffff, #0088ff)';
    startBtn.style.boxShadow = '0 4px 15px rgba(0, 255, 255, 0.4)';
    
    let actionBtn = document.getElementById('actionBtn');
    actionBtn.innerText = '🎲 シャッフル';
    actionBtn.style.background = '#ffaa00';
    actionBtn.style.color = '#000';
    
    document.getElementById('gridSelect').disabled = false;
    document.getElementById('speedSelect').disabled = false;
    document.getElementById('timeSelect').disabled = false;
    document.getElementById('p1AiSelect').disabled = false;
    document.getElementById('p2AiSelect').disabled = false;
    document.getElementById('demoBtn').style.display = 'block';
}
resetGame();

// --- 操作・イベント処理 ---
let startPos = null;
let startTile = null;

function getGridCoord(e) {
    let rect = canvas.getBoundingClientRect();
    let clientX = e.touches ? e.touches[0].clientX : e.clientX;
    let clientY = e.touches ? e.touches[0].clientY : e.clientY;
    let x = Math.floor((clientX - rect.left) / TILE_SIZE);
    let y = Math.floor((clientY - rect.top) / TILE_SIZE);
    return {x, y, clientX, clientY};
}

canvas.addEventListener('mousedown', handleStart);
canvas.addEventListener('touchstart', handleStart);
window.addEventListener('mouseup', handleEnd);
window.addEventListener('touchend', handleEnd);

function handleStart(e) {
    if (gameState === 'finished') { 
        // 終了画面タップで「同じ条件で即再戦」
        resetGame();
        startGame();
        return; 
    }
    if (gameState !== 'playing') return;
    let pos = getGridCoord(e);
    if (pos.x < 0 || pos.x >= GRID || pos.y < 0 || pos.y >= GRID) return;
    startPos = pos;
    startTile = board[pos.y][pos.x];
}

function isOccupied(tx, ty) {
    if (p1.tx === tx && p1.ty === ty) return true;
    if (p2.tx === tx && p2.ty === ty) return true;
    return false;
}

function handleEnd(e) {
    if (!startPos || gameState !== 'playing') return;
    
    let endClientX = e.changedTouches ? e.changedTouches[0].clientX : e.clientX;
    let endClientY = e.changedTouches ? e.changedTouches[0].clientY : e.clientY;
    let dx = endClientX - startPos.clientX;
    let dy = endClientY - startPos.clientY;
    let now = performance.now();
    
    // 相手が占有中のマスは操作不能
    if (now < startTile.lockUntil && startTile.lockedBy === 2) {
        startPos = null; return;
    }

    if (Math.abs(dx) > 15 || Math.abs(dy) > 15) {
        // フリック（入れ替え）
        let targetX = startTile.x;
        let targetY = startTile.y;
        if (Math.abs(dx) > Math.abs(dy)) targetX += (dx > 0) ? 1 : -1;
        else targetY += (dy > 0) ? 1 : -1;

        if (targetX >= 0 && targetX < GRID && targetY >= 0 && targetY < GRID) {
            let targetTile = board[targetY][targetX];
            if (now >= targetTile.lockUntil || targetTile.lockedBy === 1) {
                if (!isOccupied(startTile.x, startTile.y) && !isOccupied(targetX, targetY)) {
                    let tempType = startTile.type; let tempRot = startTile.rotation; let tempOwner = startTile.owner;
                    let tempVx = startTile.visualX; let tempVy = startTile.visualY; let tempVr = startTile.visualRotation;
                    
                    startTile.type = targetTile.type; startTile.rotation = targetTile.rotation; startTile.owner = targetTile.owner;
                    startTile.visualX = targetTile.visualX; startTile.visualY = targetTile.visualY; startTile.visualRotation = targetTile.visualRotation;
                    
                    targetTile.type = tempType; targetTile.rotation = tempRot; targetTile.owner = tempOwner;
                    targetTile.visualX = tempVx; targetTile.visualY = tempVy; targetTile.visualRotation = tempVr;
                    
                    let speedRatio = SPEED / 2.5;
                    startTile.lockedBy = 1; startTile.lockUntil = now + (1000 * speedRatio);
                    targetTile.lockedBy = 1; targetTile.lockUntil = now + (1000 * speedRatio);
                    // フリックによって色の配置が変化したため、囲み判定を実行
                    checkEncirclement();
                }
            }
        }
    } else {
        // クリック（占有＆回転：1秒の猶予があるため時計回りに固定）
        let speedRatio = SPEED / 2.5;
        rotateTileLogic(startTile, 1);
        startTile.lockedBy = 1;
        startTile.lockUntil = now + (1000 * speedRatio); 
    }
    startPos = null;
    startTile = null;
}

// 必殺技：最大連結成分判定を用いた「囲碁式」の囲み判定
function getEnclosedTiles(pId) {
    let visited = Array.from({length: GRID}, () => Array(GRID).fill(false));
    let components = [];

    // 自分の色以外のマスをすべてグループ分け（連結成分分解）する
    for (let y = 0; y < GRID; y++) {
        for (let x = 0; x < GRID; x++) {
            if (!visited[y][x] && board[y][x].owner !== pId) {
                let comp = [];
                let queue = [{x, y}];
                visited[y][x] = true;

                while (queue.length > 0) {
                    let curr = queue.shift();
                    comp.push(curr);
                    let dirs = [[0,-1],[1,0],[0,1],[-1,0]];
                    for (let d of dirs) {
                        let nx = curr.x + d[0], ny = curr.y + d[1];
                        if (nx >= 0 && nx < GRID && ny >= 0 && ny < GRID) {
                            if (!visited[ny][nx] && board[ny][nx].owner !== pId) {
                                visited[ny][nx] = true;
                                queue.push({x: nx, y: ny});
                            }
                        }
                    }
                }
                components.push(comp);
            }
        }
    }

    if (components.length <= 1) return []; // 囲まれた領域が存在しない

    // 最も大きいグループ（＝「外側の世界」）のサイズを特定
    let maxSize = 0;
    for (let comp of components) {
        if (comp.length > maxSize) maxSize = comp.length;
    }

    // 「外側の世界」より小さいグループはすべて「完全に切り取られた領域」とみなす
    let enclosed = [];
    for (let comp of components) {
        if (comp.length < maxSize) {
            enclosed.push(...comp);
        }
    }
    return enclosed;
}

function checkEncirclement() {
    let enc1 = getEnclosedTiles(1);
    let enc2 = getEnclosedTiles(2);
    let fillMap = Array.from({length: GRID}, () => Array(GRID).fill(null));
    
    // 両者が同時に同じ領域を囲んだ場合は、相殺されて無色（0）になる
    enc1.forEach(t => fillMap[t.y][t.x] = 1);
    enc2.forEach(t => { fillMap[t.y][t.x] = (fillMap[t.y][t.x] === 1) ? 0 : 2; });

    let now = performance.now();
    for(let y=0; y<GRID; y++) {
        for(let x=0; x<GRID; x++) {
            let targetOwner = fillMap[y][x];
            if (targetOwner !== null && board[y][x].owner !== targetOwner) {
                board[y][x].owner = targetOwner;
                board[y][x].vfxTime = now + 600; // 発光エフェクトの点火
            }
        }
    }
}

// --- COM（AI）思考ルーチン（完全仕様版：バグ解消・シャッフル・サキ＆コウ特化・ラム限定ランダム） ---

function getNextTileCoord(tx, ty, toDir) {
    let nx = tx, ny = ty;
    if (toDir === 0) ny--; if (toDir === 1) nx++; if (toDir === 2) ny++; if (toDir === 3) nx--;
    return {nx, ny};
}

// 拡張安全シミュレーション
function checkSimulateSafe(tile, enterDir, diff) {
    if (!tile) return false;
    let tempRot = (tile.rotation + diff) % 4;
    let localIn = (enterDir - tempRot + 4) % 4;
    let localOut = null;
    if (tile.type === 'line') { if (localIn === 0) localOut = 2; if (localIn === 2) localOut = 0; }
    else if (tile.type === 'curve') { if (localIn === 0) localOut = 1; if (localIn === 1) localOut = 0; }
    else if (tile.type === 'cross' || tile.type === 'overpass') { localOut = (localIn + 2) % 4; }
    else if (tile.type === 'oneway') { if (localIn === 2) localOut = 0; }
    else if (tile.type === 'double_curve') {
        if (localIn === 0) localOut = 3; if (localIn === 3) localOut = 0;
        if (localIn === 1) localOut = 2; if (localIn === 2) localOut = 1;
    }
    if (localOut === null) return false;

    let exitDir = (localOut + tempRot) % 4;

    let nx = tile.x, ny = tile.y;
    if (exitDir === 0) ny--; else if (exitDir === 1) nx++; else if (exitDir === 2) ny++; else if (exitDir === 3) nx--;
    
    // 盤面外に出る場合は反射されるので危険
    if (nx < 0 || nx >= GRID || ny < 0 || ny >= GRID) return false;

    let nextEnterDir = (exitDir + 2) % 4;
    let nextTile = board[ny][nx];
    
    // 2手先のマスが「現在自分が乗っているマス」だった場合は逆流になるため、出口チェックを免除
    let now = performance.now();
    // 【修正】グローバル変数 p1, p2 の現在位置と直接比較して自分が乗っているマスか判定する
    let isCurrentTileP1 = (p1 && p1.tx === nx && p1.ty === ny);
    let isCurrentTileP2 = (p2 && p2.tx === nx && p2.ty === ny);
    let isCurrentTile = isCurrentTileP1 || isCurrentTileP2;
    
    // 自分自身が乗っているマスを先読みした場合は、逆流になるので getExit のチェックを免除
    if (!isCurrentTile && nextTile.getExit(nextEnterDir) === null) {
        // 先が塞がっていても、相手にロックされていなければ後で自分で回せるのでセーフとする
        if (now < nextTile.lockUntil && nextTile.lockedBy !== 0) {
            // ロックしているのが自分でないなら本当に危険
            if ((isCurrentTileP1 && nextTile.lockedBy !== 1) || (isCurrentTileP2 && nextTile.lockedBy !== 2)) {
                return false; 
            }
        }
    }

    return true;
}

function aiDoFlick(t1, t2, pId, now) {
    let speedRatio = SPEED / 2.5;
    let tempType = t1.type; let tempRot = t1.rotation; let tempOwner = t1.owner;
    let tempVx = t1.visualX; let tempVy = t1.visualY; let tempVr = t1.visualRotation;
    t1.type = t2.type; t1.rotation = t2.rotation; t1.owner = t2.owner;
    t1.visualX = t2.visualX; t1.visualY = t2.visualY; t1.visualRotation = t2.visualRotation;
    t2.type = tempType; t2.rotation = tempRot; t2.owner = tempOwner;
    t2.visualX = tempVx; t2.visualY = tempVy; t2.visualRotation = tempVr;
    t1.lockedBy = pId; t1.lockUntil = now + (1000 * speedRatio);
    t2.lockedBy = pId; t2.lockUntil = now + (1000 * speedRatio);
    checkEncirclement();
}

function thinkAI(player, opponent, now) {
    if (now < player.cooldown) return;
    
    let aiType = player.id === 1 ? document.getElementById('p1AiSelect').value : document.getElementById('p2AiSelect').value;
    if (isDemo && player.id === 1 && aiType === 'manual') aiType = 'saki';
    if (!isDemo && player.id === 1 && aiType === 'manual') return;

    // 【修正】回転はコマ乗りOK。フリックは対象マス両方が空いている必要あり（チート防止）
    const canRotate = (t) => t && !(now < t.lockUntil && t.lockedBy === opponent.id);
    const canFlick = (t1, t2) => canRotate(t1) && canRotate(t2) && !isOccupied(t1.x, t1.y) && !isOccupied(t2.x, t2.y);

    let target = null;
    let rotCount = 0;
    let flickTarget = null;

    let enterDir = (player.toDir + 2) % 4;
    let nextCoord = getNextTileCoord(player.tx, player.ty, player.toDir);
    let nextTile = (nextCoord.nx >= 0 && nextCoord.nx < GRID && nextCoord.ny >= 0 && nextCoord.ny < GRID) ? board[nextCoord.ny][nextCoord.nx] : null;
    let currentTile = board[player.ty][player.tx];

    const getShuffledArray = (arr) => {
        for (let i = arr.length - 1; i > 0; i--) { let j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; }
        return arr;
    };

    let isDanger = false;
    if (!nextTile) {
        isDanger = true;
    } else {
        if (!checkSimulateSafe(nextTile, enterDir, 0)) isDanger = true;
    }

    // ルートの評価関数（無色・敵色は高評価、逆走はペナルティ）
    const evaluateRoute = (tile, checkRot, fromDir) => {
        let score = 0;
        let tempRot = (tile.rotation + checkRot) % 4;
        let localIn = (fromDir - tempRot + 4) % 4;
        let localOut = null;
        if (tile.type === 'line') { if (localIn === 0) localOut = 2; if (localIn === 2) localOut = 0; }
        else if (tile.type === 'curve') { if (localIn === 0) localOut = 1; if (localIn === 1) localOut = 0; }
        else if (tile.type === 'cross' || tile.type === 'overpass') { localOut = (localIn + 2) % 4; }
        else if (tile.type === 'oneway') { if (localIn === 2) localOut = 0; }
        else if (tile.type === 'double_curve') {
            if (localIn === 0) localOut = 3; if (localIn === 3) localOut = 0;
            if (localIn === 1) localOut = 2; if (localIn === 2) localOut = 1;
        }
        if (localOut === null) return -999;
        
        let exitDir = (localOut + tempRot) % 4;
        let nx = tile.x, ny = tile.y;
        if (exitDir === 0) ny--; else if (exitDir === 1) nx++; else if (exitDir === 2) ny++; else if (exitDir === 3) nx--;
        if (nx >= 0 && nx < GRID && ny >= 0 && ny < GRID) {
            let nextT = board[ny][nx];
            if (nextT.owner === 0) score += 10; // 無色
            else if (nextT.owner === opponent.id) score += 5; // 敵色
            else score -= 10; // 自陣
            
            // 逆走（来た道を戻る）には強烈なペナルティ
            if (nx === currentTile.x && ny === currentTile.y) score -= 100;
        }
        return score;
    };

    const tryRotateNext = () => {
        if (nextTile && canRotate(nextTile)) {
            let candidates = [];
            let rots = [1, 2, 3];
            for (let r of rots) {
                if (checkSimulateSafe(nextTile, enterDir, r)) {
                    let s = evaluateRoute(nextTile, r, enterDir);
                    // 評価値を基に「重み（選択されやすさ）」を計算（マイナス評価でも最低限の重みを持たせる）
                    let weight = Math.max(1, s + 150); 
                    candidates.push({ rot: r, weight: weight });
                }
            }
            if (candidates.length > 0) {
                // スコアの高さに応じて選ばれやすくする「重みづけランダム」
                let totalWeight = candidates.reduce((sum, c) => sum + c.weight, 0);
                let randomVal = Math.random() * totalWeight;
                let accumulated = 0;
                let chosen = candidates[0];
                for (let c of candidates) {
                    accumulated += c.weight;
                    if (randomVal <= accumulated) {
                        chosen = c;
                        break;
                    }
                }
                target = nextTile;
                rotCount = chosen.rot;
                return true;
            }
        }
        return false;
    };

    const tryEscape = () => {
        if (canRotate(currentTile)) {
            let rots = getShuffledArray([1, 2, 3]);
            for (let r of rots) {
                let newToDir = (player.toDir + r) % 4; 
                let escCoord = getNextTileCoord(player.tx, player.ty, newToDir);
                if (escCoord.nx >= 0 && escCoord.nx < GRID && escCoord.ny >= 0 && escCoord.ny < GRID) {
                    let escTile = board[escCoord.ny][escCoord.nx];
                    let escEnterDir = (newToDir + 2) % 4;
                    if (escTile.getExit(escEnterDir) !== null && checkSimulateSafe(escTile, escEnterDir, 0) && !(now < escTile.lockUntil && escTile.lockedBy === opponent.id)) {
                        target = currentTile; rotCount = r; return true;
                    }
                }
            }
        }
        return false;
    };

    const tryFlickSolve = () => {
        if (!nextTile) return false;
        let dirs = getShuffledArray([[0,-1],[1,0],[0,1],[-1,0]]);
        for (let d of dirs) {
            let fx = nextTile.x + d[0], fy = nextTile.y + d[1];
            if (fx >= 0 && fx < GRID && fy >= 0 && fy < GRID && !(fx === currentTile.x && fy === currentTile.y)) {
                let candTile = board[fy][fx];
                if (canFlick(nextTile, candTile)) {
                    if (checkSimulateSafe(candTile, enterDir, 0)) {
                        flickTarget = {t1: nextTile, t2: candTile};
                        return true;
                    }
                }
            }
        }
        return false;
    };

    // 【追加】高度なヤケクソフリック脱出（自分の周囲のマスを、盤面中のどこかのマスと無差別にフリック）
    const tryAdvancedFlick = () => {
        let dirs = [[0,0], [0,-1],[1,0],[0,1],[-1,0]]; // 自分自身(0,0)も含める
        let cands = [];
        for (let d of dirs) {
            let cx = player.tx + d[0], cy = player.ty + d[1];
            if (cx >= 0 && cx < GRID && cy >= 0 && cy < GRID) {
                let adjTile = board[cy][cx];
                if (canRotate(adjTile)) cands.push(adjTile);
            }
        }
        
        // 周辺の動かせるマスを、盤面のランダムなマスとフリック試行
        for (let adjTile of getShuffledArray(cands)) {
            for (let i = 0; i < 8; i++) {
                let rx = Math.floor(Math.random() * GRID), ry = Math.floor(Math.random() * GRID);
                let candTile = board[ry][rx];
                if (canFlick(adjTile, candTile)) {
                    flickTarget = {t1: adjTile, t2: candTile};
                    return true;
                }
            }
        }
        return false;
    };

    // チョウ・サキは自陣ループ（塗り広げにならない状態）を検知して積極的に進路変更する
    let wantToChange = false;
    if (!isDanger && nextTile && nextTile.owner === player.id && (aiType === 'chou' || aiType === 'saki')) {
        wantToChange = true;
    }

    if ((isDanger || wantToChange) && aiType !== 'ramu') {
        let solved = false;
        if (aiType === 'chou' || aiType === 'saki' || aiType === 'kou') {
            if (Math.random() < 0.5) { solved = tryFlickSolve(); if (!solved) solved = tryRotateNext(); }
            else { solved = tryRotateNext(); if (!solved) solved = tryFlickSolve(); }
            if (!solved) solved = tryEscape();
        } else {
            // セイ・デロの通常の回避
            solved = tryRotateNext();
            if (!solved) solved = tryEscape();
        }
        
        // 【追加】すべてのAI共通：通常の回避策がすべて失敗した場合は、ヤケクソで盤面をかき回す
        if (!solved && isDanger) {
            solved = tryAdvancedFlick(); // まずヤケクソフリックを試す
            
            if (!solved) {
                // フリックもダメならヤケクソ回転
                let escapeTargets = [];
                if (canRotate(currentTile)) escapeTargets.push(currentTile);
                if (nextTile && canRotate(nextTile)) escapeTargets.push(nextTile);
                
                if (escapeTargets.length > 0) {
                    target = escapeTargets[Math.floor(Math.random() * escapeTargets.length)];
                    rotCount = getShuffledArray([1, 2, 3])[0];
                    solved = true;
                }
            }
        }
    }

    if (!target && !flickTarget && aiType !== 'sei') {
        if (aiType === 'ramu') {
            let targetCenter = Math.random() < 0.5 ? player : opponent;
            // 【修正】ラムの行動範囲（フリックは3x3、回転は5箇所）
            if (Math.random() < 0.5) {
                let cands = [];
                for (let y = Math.max(0, targetCenter.ty - 1); y <= Math.min(GRID - 1, targetCenter.ty + 1); y++) {
                    for (let x = Math.max(0, targetCenter.tx - 1); x <= Math.min(GRID - 1, targetCenter.tx + 1); x++) {
                        let t1 = board[y][x];
                        if (x + 1 < GRID && canFlick(t1, board[y][x + 1])) cands.push({t1: t1, t2: board[y][x + 1]});
                        if (y + 1 < GRID && canFlick(t1, board[y + 1][x])) cands.push({t1: t1, t2: board[y + 1][x]});
                    }
                }
                if (cands.length > 0) flickTarget = cands[Math.floor(Math.random() * cands.length)];
            }
            if (!flickTarget) {
                let cands = [];
                let dirs = [[0,0], [0,-1], [1,0], [0,1], [-1,0]];
                for (let d of dirs) {
                    let cx = targetCenter.tx + d[0], cy = targetCenter.ty + d[1];
                    if (cx >= 0 && cx < GRID && cy >= 0 && cy < GRID) {
                        let t = board[cy][cx];
                        if (canRotate(t)) cands.push(t);
                    }
                }
                if (cands.length > 0) {
                    target = cands[Math.floor(Math.random() * cands.length)];
                    rotCount = getShuffledArray([1, 2, 3])[0];
                }
            }
        } 
        else {
            if ((aiType === 'saki' || aiType === 'kou') && Math.random() < 0.25) {
                let cands = [];
                for (let i=0; i<6; i++) {
                    let rx = Math.floor(Math.random() * (GRID - 1)), ry = Math.floor(Math.random() * GRID);
                    let t1 = board[ry][rx], t2 = board[ry][rx+1];
                    if (canFlick(t1, t2)) {
                        if (aiType === 'kou' && (t1.owner !== player.id || t2.owner !== player.id)) cands.push({t1, t2});
                        else if (aiType === 'saki') cands.push({t1, t2});
                    }
                }
                if (cands.length > 0) flickTarget = cands[Math.floor(Math.random() * cands.length)];
            }

            if (!flickTarget) {
                let cands = [];
                for (let y = 0; y < GRID; y++) {
                    for (let x = 0; x < GRID; x++) {
                        let t = board[y][x];
                        // 【修正】自分の安全な進路は壊さない
                        if (t === nextTile && !isDanger) continue;

                        if (canRotate(t)) {
                            let isNotMyColor = (t.owner !== player.id);
                            if (aiType === 'saki') {
                                if (isNotMyColor) cands.push(t);
                            } else {
                                if (isNotMyColor || Math.random() < 0.2) cands.push(t);
                            }
                        }
                    }
                }

                if (cands.length > 0) {
                    if (aiType === 'kou') {
                        cands.sort((a, b) => {
                            let scoreA = 0, scoreB = 0;
                            const countFriends = (tile) => {
                                let cnt = 0;
                                let dirs = [[0,-1],[1,0],[0,1],[-1,0]];
                                for (let d of dirs) {
                                    let nx = tile.x + d[0], ny = tile.y + d[1];
                                    if (nx >= 0 && nx < GRID && ny >= 0 && ny < GRID) {
                                        if (board[ny][nx].owner === player.id) cnt++;
                                    }
                                }
                                return cnt;
                            };
                            return countFriends(b) - countFriends(a);
                        });
                        target = cands[0]; 
                    } else if (aiType === 'dero') {
                        // デロ（開拓者）：まだ誰にも塗られていない無色のマスを最優先で狙う
                        let neutralCands = cands.filter(t => t.owner === 0);
                        if (neutralCands.length > 0) {
                            target = neutralCands[Math.floor(Math.random() * neutralCands.length)];
                        } else {
                            target = cands[Math.floor(Math.random() * cands.length)];
                        }
                    } else if (aiType === 'chou') {
                        // チョウ（頂点）：敵陣の破壊・奪取を最優先、無ければ無色を狙う
                        let enemyCands = cands.filter(t => t.owner === opponent.id);
                        let neutralCands = cands.filter(t => t.owner === 0);
                        if (enemyCands.length > 0) {
                            target = enemyCands[Math.floor(Math.random() * enemyCands.length)];
                        } else if (neutralCands.length > 0) {
                            target = neutralCands[Math.floor(Math.random() * neutralCands.length)];
                        } else {
                            target = cands[Math.floor(Math.random() * cands.length)];
                        }
                    } else {
                        target = cands[Math.floor(Math.random() * cands.length)];
                    }
                    rotCount = getShuffledArray([1, 2, 3])[0];
                }
            }
        }
    }

    let speedRatio = SPEED / 2.5;

    if (flickTarget) {
        aiDoFlick(flickTarget.t1, flickTarget.t2, player.id, now);
    } else if (target && rotCount > 0) {
        rotateTileLogic(target, rotCount);
        target.lockedBy = player.id;
        target.lockUntil = now + 1000;
    } else {
        // 【修正】ターゲットが無く「何もしない(パス)」場合は、長考せずにすぐ(約0.2秒後)に盤面を再評価する
        player.cooldown = now + (200 * speedRatio);
        return; 
    }
    
    // 割り算を掛け算に変更（SPEED値が小さい＝高速なほど、待機時間も短くなる）
    let baseDelay = 1200 * speedRatio;
    if (aiType === 'chou') baseDelay *= 0.4; // チョウは超高速思考
    else if (aiType === 'saki') baseDelay *= 0.6;
    
    let actionCost = 0;
    if (flickTarget) actionCost = 1;
    else if (target) actionCost = rotCount;
    
    // 【修正】追加コスト（200ms）もゲームスピードに同期させる
    player.cooldown = now + baseDelay + (actionCost * 200 * speedRatio) + (Math.random() * 300 * speedRatio);
}

// 【修正】AI思考ループの頻度をゲームスピード(SPEED)に対して可変にする
function aiLoop() {
    if (gameState === 'playing') {
        let now = performance.now();
        thinkAI(p2, p1, now); 
        thinkAI(p1, p2, now); 
    }
    setTimeout(aiLoop, 150 * (SPEED / 2.5));
}
setTimeout(aiLoop, 150); 

// --- 座標計算と描画 ---
function getPos(p) {
    let tile = board[p.ty][p.tx];
    
    const getOffset = (dir) => {
        if (dir === 0) return {x: 0, y: -0.5};
        if (dir === 1) return {x: 0.5, y: 0};
        if (dir === 2) return {x: 0, y: 0.5};
        if (dir === 3) return {x: -0.5, y: 0};
    };
    
    let start = getOffset(p.fromDir);
    let end = getOffset(p.toDir);
    
    let prog = p.progress;
    let lx, ly;
    let isStraight = Math.abs(p.fromDir - p.toDir) === 2 || p.fromDir === p.toDir;
    
    if (isStraight) {
        lx = start.x + (end.x - start.x) * prog;
        ly = start.y + (end.y - start.y) * prog;
    } else {
        // 真円の弧に沿って滑らかに進む軌道の三角関数計算
        let cx = start.x + end.x;
        let cy = start.y + end.y;
        let startAngle = Math.atan2(start.y - cy, start.x - cx);
        let endAngle = Math.atan2(end.y - cy, end.x - cx);
        
        let diff = endAngle - startAngle;
        if (diff > Math.PI) diff -= Math.PI * 2;
        if (diff < -Math.PI) diff += Math.PI * 2;
        
        let currentAngle = startAngle + diff * prog;
        lx = cx + 0.5 * Math.cos(currentAngle);
        ly = cy + 0.5 * Math.sin(currentAngle);
    }

    let angleDiff = (tile.visualRotation - tile.rotation) * Math.PI / 2;
    let rx = lx * Math.cos(angleDiff) - ly * Math.sin(angleDiff);
    let ry = lx * Math.sin(angleDiff) + ly * Math.cos(angleDiff);
    
    let cx = tile.visualX * TILE_SIZE + TILE_SIZE / 2 + rx * TILE_SIZE;
    let cy = tile.visualY * TILE_SIZE + TILE_SIZE / 2 + ry * TILE_SIZE;
    return {x: cx, y: cy};
}

let scoreP1 = 0; let scoreP2 = 0;

function update(dt) {
    // 描画補間は一時停止中でも実行（アニメーションを滑らかに終わらせる）
    board.forEach(row => row.forEach(t => {
        t.visualX += (t.x - t.visualX) * 15 * dt;
        t.visualY += (t.y - t.visualY) * 15 * dt;
        let rDiff = t.rotation - t.visualRotation;
        while(rDiff < -2) rDiff += 4;
        while(rDiff > 2) rDiff -= 4;
        t.visualRotation += rDiff * 15 * dt;
    }));

    if (gameState !== 'playing') return; // プレイ中以外は時間を進めない

    // 【修正】タイマーの減算をキャラクターの移動速度(SPEED)に同期させる
    // 基準速度(2.5)の時は実時間通り1秒減る。超絶早送り(0.1)の時は25倍の速度で時間が減る。
    timeLeft -= dt * (2.5 / SPEED); 
    
    if (timeLeft <= 0) {
        timeLeft = 0; 
        gameState = 'finished'; 
        
        // 勝敗を1回だけ記録
        if (scoreP1 > scoreP2) winsP1++;
        else if (scoreP2 > scoreP1) winsP2++;
        else draws++;
        updateRecords();
        
        // TIME UP後にスタートボタンを「設定に戻る」に変更
        document.getElementById('startBtn').innerText = '設定に戻る';

        // 連続対戦中なら、結果を1秒間表示してから自動で次の試合を開始する
        if (isAutoBattle) {
            setTimeout(() => {
                if (isAutoBattle && gameState === 'finished') {
                    resetGame();
                    startGame();
                }
            }, 1000); // 1000ミリ秒（1秒）後に次戦スタート
        }
    }
    document.getElementById('timer').innerText = Math.ceil(timeLeft);

    [p1, p2].forEach(p => {
        let oldProg = p.progress;
        p.progress += dt / SPEED;

        if (oldProg < 0.5 && p.progress >= 0.5) {
            let tile = board[p.ty][p.tx];
            if (tile.owner !== p.id) {
                tile.owner = p.id;
                checkEncirclement(); // 塗るたびに囲み判定チェック
            }
        }

        if (p.progress >= 1.0) {
            let nx = p.tx, ny = p.ty;
            if (p.toDir === 0) ny--; if (p.toDir === 1) nx++; if (p.toDir === 2) ny++; if (p.toDir === 3) nx--;

            if (nx < 0 || nx >= GRID || ny < 0 || ny >= GRID) {
                p.reverse();
            } else {
                let enterDir = (p.toDir + 2) % 4;
                let nextTile = board[ny][nx];
                if (nextTile.getExit(enterDir) === null) {
                    p.reverse(); 
                } else {
                    p.tx = nx; p.ty = ny; p.fromDir = enterDir; p.progress -= 1.0;
                    
                    // 【修正】新しいマスに入った瞬間（0.0の時点）に即座に出口を計算してセットする
                    p.toDir = nextTile.getExit(p.fromDir);
                    if (p.toDir === null) {
                        p.toDir = p.fromDir;
                        p.progress = 0.5; 
                        p.reverse();
                    }
                }
            }
        }
    });

    let pos1 = getPos(p1); let pos2 = getPos(p2);
    if (Math.hypot(pos1.x - pos2.x, pos1.y - pos2.y) < TILE_SIZE * 0.4) {
        let sameTile = (p1.tx === p2.tx && p1.ty === p2.ty);
        let tile = board[p1.ty][p1.tx];
        // オーバーパスとダブルカーブはすれ違い可能
        let safe = (sameTile && (tile.type === 'overpass' || tile.type === 'double_curve') && (p1.fromDir % 2 !== p2.fromDir % 2));
        
        if (!safe) {
            p1.reverse(); p1.progress += 0.05;
            p2.reverse(); p2.progress += 0.05;
        }
    }

    let s1 = 0, s2 = 0;
    board.forEach(row => row.forEach(t => { if (t.owner === 1) s1++; if (t.owner === 2) s2++; }));
    scoreP1 = Math.floor((s1 / (GRID * GRID)) * 100);
    scoreP2 = Math.floor((s2 / (GRID * GRID)) * 100);
    document.getElementById('score1').innerText = scoreP1;
    document.getElementById('score2').innerText = scoreP2;
}

function drawTile(ctx, tile) {
    ctx.save();
    ctx.translate(tile.visualX * TILE_SIZE + TILE_SIZE/2, tile.visualY * TILE_SIZE + TILE_SIZE/2);
    
    // 希望3: 塗られたマスは、色がつかないとわかりにくい -> はっきりした色（以前の色）に戻す
    let isP1 = tile.owner === 1;
    let isP2 = tile.owner === 2;
    ctx.fillStyle = isP1 ? '#004444' : isP2 ? '#440022' : '#222'; // 以前の色を参考にはっきりさせる。未占有は少しグレーに。 CSSの背景色は真っ黒にしたので。
    ctx.fillRect(-TILE_SIZE/2, -TILE_SIZE/2, TILE_SIZE, TILE_SIZE);

    // 必殺技のフラッシュ・エフェクト
    let now = performance.now();
    if (now < tile.vfxTime) {
        let p = (tile.vfxTime - now) / 600; // 1.0 -> 0.0で減衰
        ctx.fillStyle = `rgba(255, 255, 200, ${p * 0.5})`;
        ctx.fillRect(-TILE_SIZE/2, -TILE_SIZE/2, TILE_SIZE, TILE_SIZE);
    }
    
    ctx.rotate(tile.visualRotation * Math.PI / 2);

    // 希望2: 自分がいるますのレールだけネオン発光。離脱したら元に戻る。
    // 希望1: レールが見えにくくなった -> 明るいグレー（以前の色）に戻す
    const drawPipe = (pathFunc) => {
        ctx.lineCap = 'round';
        
        // 滞在判定
        let occupyingP1 = (tile.x === p1.tx && tile.y === p1.ty);
        let occupyingP2 = (tile.x === p2.tx && tile.y === p2.ty);
        let currentOccupant = occupyingP1 ? 1 : occupyingP2 ? 2 : 0;

        if (currentOccupant !== 0) {
            // 希望2: 自分がいるマスのレールだけネオン発光 (滞在プレイヤーの色、強烈)
            let color = currentOccupant === 1 ? '#00ffff' : '#ff0055';
            ctx.shadowBlur = 20; // 強く
            ctx.shadowColor = color;
            ctx.lineWidth = 14;
            ctx.strokeStyle = color;
            pathFunc();
            // コア（中心の白い光）
            ctx.shadowBlur = 0;
            ctx.lineWidth = 5;
            ctx.strokeStyle = '#ffffff';
            pathFunc();
        } else if (tile.owner !== 0) {
            // 希望2: 離脱したらレールは元の色に戻る (占有済みならそのオーナーの色、セイ・コウの予測にも使う)
            let color = isP1 ? '#00ffff' : '#ff0055';
            ctx.shadowBlur = 15;
            ctx.shadowColor = color;
            ctx.lineWidth = 14;
            ctx.strokeStyle = color;
            pathFunc();
            // コア
            ctx.shadowBlur = 0;
            ctx.lineWidth = 5;
            ctx.strokeStyle = '#ffffff';
            pathFunc();
        } else {
            // 希望1: 未占有・未滞在のレール -> 見えにくいので以前の明るいグレーに戻す
            ctx.shadowBlur = 0;
            ctx.lineWidth = 12; // 以前の太さ
            ctx.strokeStyle = '#888'; // 以前の明るいグレー
            pathFunc();
        }
    };

    const R = TILE_SIZE/2;

    // パス描画
    if (tile.type === 'line') {
        drawPipe(() => { ctx.beginPath(); ctx.moveTo(0, -R); ctx.lineTo(0, R); ctx.stroke(); });
    } else if (tile.type === 'curve') {
        drawPipe(() => { ctx.beginPath(); ctx.arc(R, -R, R, Math.PI, Math.PI/2, true); ctx.stroke(); });
    } else if (tile.type === 'cross') {
        drawPipe(() => { 
            ctx.beginPath(); ctx.moveTo(0, -R); ctx.lineTo(0, R); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(-R, 0); ctx.lineTo(R, 0); ctx.stroke(); 
        });
    } else if (tile.type === 'overpass') {
        // 立体交差：下になる管を描いてから、黒い影で分断し、上の管を描く（2Dでの擬似3D表現）
        drawPipe(() => { ctx.beginPath(); ctx.moveTo(0, -R); ctx.lineTo(0, R); ctx.stroke(); });
        
        ctx.shadowBlur = 10; ctx.shadowColor = '#000';
        ctx.lineWidth = 20; ctx.strokeStyle = '#000'; // 下の管を黒でぶった切る
        ctx.beginPath(); ctx.moveTo(-R, 0); ctx.lineTo(R, 0); ctx.stroke();
        ctx.shadowBlur = 0;
        
        drawPipe(() => { ctx.beginPath(); ctx.moveTo(-R, 0); ctx.lineTo(R, 0); ctx.stroke(); });
    } else if (tile.type === 'oneway') {
        drawPipe(() => { ctx.beginPath(); ctx.moveTo(0, -R); ctx.lineTo(0, R); ctx.stroke(); });
        // 発光する矢印（視認性を高めるため、進行方向を常に黄色系ネオンで表示）
        ctx.fillStyle = '#ffaa00';
        ctx.shadowBlur = 10;
        ctx.shadowColor = '#ffaa00';
        ctx.beginPath(); ctx.moveTo(0, -14); ctx.lineTo(-12, 10); ctx.lineTo(12, 10); ctx.fill();
    } else if (tile.type === 'double_curve') {
        drawPipe(() => { ctx.beginPath(); ctx.arc(-R, -R, R, 0, Math.PI/2, false); ctx.stroke(); });
        drawPipe(() => { ctx.beginPath(); ctx.arc(R, R, R, Math.PI, Math.PI*1.5, false); ctx.stroke(); });
    }
    ctx.restore();

    // ロック中UI（青く発光）
    ctx.save();
    ctx.translate(tile.visualX * TILE_SIZE, tile.visualY * TILE_SIZE);
    if (now < tile.lockUntil) {
        let color = tile.lockedBy === 1 ? '#00ffff' : '#ff0055';
        ctx.strokeStyle = color;
        ctx.shadowColor = color;
        ctx.shadowBlur = 10;
        ctx.lineWidth = 2;
        ctx.strokeRect(1, 1, TILE_SIZE-2, TILE_SIZE-2);
    }
    ctx.restore();
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    board.forEach(row => row.forEach(t => drawTile(ctx, t)));

    [p1, p2].forEach(p => {
        let pos = getPos(p);
        let pNext = { tx: p.tx, ty: p.ty, fromDir: p.fromDir, toDir: p.toDir, progress: p.progress + 0.01 };
        let posNext = getPos(pNext);
        let angle = Math.atan2(posNext.y - pos.y, posNext.x - pos.x);

        ctx.beginPath();
        ctx.arc(pos.x, pos.y, 14, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.fill();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2.5;
        // キャラクター自体の光
        ctx.shadowBlur = 10;
        ctx.shadowColor = p.color;
        ctx.stroke();
        ctx.shadowBlur = 0; // 他の描画に影響しないよう戻す

        ctx.save();
        ctx.translate(pos.x, pos.y);
        ctx.rotate(angle);
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.moveTo(8, 0); ctx.lineTo(-5, 6); ctx.lineTo(-2, 0); ctx.lineTo(-5, -6);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
    });

    if (gameState === 'finished') {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillStyle = '#fff'; ctx.font = 'bold 48px sans-serif';
        ctx.fillText("TIME UP", canvas.width/2, canvas.height/2 - 60);
        
        ctx.font = 'bold 36px sans-serif';
        let resultMsg = "";
        if (scoreP1 > scoreP2) { ctx.fillStyle = '#00ffff'; resultMsg = "P1 WIN!"; } 
        else if (scoreP2 > scoreP1) { ctx.fillStyle = '#ff0055'; resultMsg = "P2 WIN!"; } 
        else { ctx.fillStyle = '#fff'; resultMsg = "DRAW"; }
       ctx.fillText(resultMsg, canvas.width/2, canvas.height/2 + 20);
        ctx.font = '24px sans-serif'; ctx.fillStyle = '#ffcc00';
        ctx.fillText("🔁 タップでこのまま再戦！", canvas.width/2, canvas.height/2 + 80);
    }
}

function loop(time) {
    let dt = (time - lastTime) / 1000;
    if (dt > 0.1) dt = 0.1; 
    lastTime = time;
    update(dt); draw();
    requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
